# soclab sourcetype parsing. Copied into the container's system/local at setup.
[falco:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
TRUNCATE = 0

[linux:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = audit\(
TIME_FORMAT = %s
KV_MODE = auto

[linux:sysmon]
SHOULD_LINEMERGE = false
LINE_BREAKER = (<Event>)
TIME_PREFIX = UtcTime>
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
